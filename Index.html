<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Top-down Car Dodger</title>
<link rel="stylesheet" href="Style.css" />
</head>
<body>
  <div class="frame" role="application" aria-label="Car dodger game">
    <div class="game-area" id="gameArea">
      <canvas id="gameCanvas" width="360" height="640"></canvas>

      <!-- overlay panel (start / game over) -->
      <div class="overlay" id="overlay">
        <div class="panel" id="panel">
          <h2 id="panelTitle">Top-down Car Dodger</h2>
          <p id="panelText">Use ← → or A D to move. On mobile use the buttons. Avoid obstacles and get a high score!</p>
          <div style="display:flex;gap:8px;justify-content:center">
            <button class="btn" id="btnHow">How to play</button>
            <button class="btn primary" id="btnStart">Start</button>
          </div>
        </div>
      </div>

      <!-- on-screen touch controls -->
      <div class="touch-controls" id="touchControls" aria-hidden="false">
        <button id="leftBtn" aria-label="Left">◀</button>
        <button id="rightBtn" aria-label="Right">▶</button>
      </div>
    </div>

    <div class="hud">
      <div class="score">Score: <span id="score">0</span></div>
      <div class="controls">
        <div id="speedText">Speed: 1.0x</div>
        <button class="btn small" id="muteBtn">Mute</button>
        <button class="btn small" id="resetBtn">Reset</button>
      </div>
    </div>
  </div>

<script src="Script.js"></script>
</body>
</html>
